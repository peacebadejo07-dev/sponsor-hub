<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- The blur background drifts in on the first page of a visit only (see BlurBg.svelte). -->
		<script nonce="%sveltekit.nonce%">try{var d=document.documentElement;if(sessionStorage.getItem('sh-blur'))d.classList.add('blur-seen');else{sessionStorage.setItem('sh-blur','1');setTimeout(function(){d.classList.add('blur-seen')},1600)}}catch(e){}</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
